<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYWRLD Admin</title>
<style>
:root{--bg:#080a0f;--panel:#11151d;--soft:#1a202a;--line:#27303d;--text:#f6f8fb;--muted:#9ca7b7;--brand:#5ee1a2;--danger:#ff6972}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Arial}button,input,select,textarea{font:inherit}a{color:inherit}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;letter-spacing:.1em;margin-bottom:25px}.brand b{color:var(--brand)}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:11px;border-radius:10px;cursor:pointer;margin:3px 0}.nav button.active,.nav button:hover{background:var(--soft);color:white}.main{padding:28px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:27px}.muted{color:var(--muted)}.panel{margin-top:16px}.panel h2{margin-top:0}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--brand);color:#05120b;font-weight:800;cursor:pointer}.btn.secondary{background:var(--soft);color:white}.btn.danger{background:var(--danger);color:white}.actions{display:flex;gap:6px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.span2{grid-column:span 2}.span3{grid-column:span 3}label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}input,select,textarea{width:100%;background:#0b0e13;border:1px solid var(--line);border-radius:9px;color:white;padding:9px}textarea{min-height:90px;resize:vertical}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:16px}.login input{margin:5px 0 12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:12px}.row{display:flex;gap:10px;align-items:end}.row>*{flex:1}.scroll{overflow:auto}.toast{position:fixed;right:18px;bottom:18px;background:#18231d;border:1px solid #2f6149;padding:12px 15px;border-radius:10px;display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.main{padding:18px}}
</style></head><body><div id="root"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(url,opt={})=>{const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};let content=[],selected=null,tab='dashboard';
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
async function boot(){const s=await api('/api/admin/session');if(!s.authenticated)return login();renderShell();await openTab('dashboard')}
function login(){$('#root').innerHTML=`<div class="login"><form id="login"><h1>CYWRLD Admin</h1><p class="muted">Sign in to manage the site.</p><label>Username or email</label><input name="username" required><label>Password</label><input name="password" type="password" required><button class="btn" style="width:100%">Sign in</button><p><a href="/">← Back to website</a></p></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});boot()}catch(err){alert(err.message)}}}
function renderShell(){$('#root').innerHTML=`<div class="shell"><aside class="side"><div class="brand">CY<b>WRLD</b></div><div class="nav">${['dashboard','content','manage','comments','ads','users','settings','analytics'].map(x=>`<button data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><hr style="border-color:var(--line);border-width:1px 0 0"><p><a href="/" target="_blank">Open website ↗</a></p><button class="btn danger" id="logout">Sign out</button></aside><main class="main"><div class="bar"><div><h1 id="title" style="margin:0">Dashboard</h1><div class="muted" id="sub"></div></div></div><div id="view"></div></main></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()}}
async function openTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('#title').textContent=name[0].toUpperCase()+name.slice(1);$('#view').innerHTML='<p class="muted">Loading…</p>';try{if(name==='dashboard')return dashboard();if(name==='content')return contentTab();if(name==='manage')return manageTab();if(name==='comments')return commentsTab();if(name==='ads')return adsTab();if(name==='users')return usersTab();if(name==='settings')return settingsTab();if(name==='analytics')return analyticsTab()}catch(e){$('#view').innerHTML=`<div class="panel">${esc(e.message)}</div>`}}
async function dashboard(){const s=await api('/api/admin/stats');$('#view').innerHTML=`<div class="grid">${Object.entries({Titles:s.totalTitles,Published:s.published,Users:s.users,'Pending comments':s.pendingComments,'Views today':s.viewsToday,'Download clicks':s.downloadClicks}).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join('')}</div><div class="panel"><h2>Fast workflow</h2><p>Use <b>Content</b> to publish a title. Then use <b>Manage</b> to add episodes and extra download servers.</p></div>`}
function contentForm(x={}){return `<form id="contentForm" enctype="multipart/form-data"><input type="hidden" name="id" value="${x.id||''}"><div class="formgrid"><div class="span2"><label>Title *</label><input name="title" value="${esc(x.title||'')}" required></div><div><label>Year</label><input name="year" type="number" value="${esc(x.year||new Date().getFullYear())}"></div><div><label>Type</label><select name="type">${['Movie','Series','Animation','Software','Documentary'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`)}</select></div><div><label>Category</label><input name="category" value="${esc(x.category||'Featured')}"></div><div><label>Genre</label><input name="genre" value="${esc(x.genre||'')}"></div><div><label>Language</label><input name="language" value="${esc(x.language||'')}"></div><div><label>Country</label><input name="country" value="${esc(x.country||'')}"></div><div><label>Quality</label><input name="quality" value="${esc(x.quality||'')}"></div><div><label>Size</label><input name="size" value="${esc(x.size||'')}"></div><div><label>Duration</label><input name="duration" value="${esc(x.duration||'')}"></div><div><label>Status</label><select name="status"><option value="published" ${x.status!=='draft'?'selected':''}>Published</option><option value="draft" ${x.status==='draft'?'selected':''}>Draft</option></select></div><div><label>Featured</label><select name="featured"><option value="false">No</option><option value="true" ${x.featured?'selected':''}>Yes</option></select></div><div class="span3"><label>Description</label><textarea name="description">${esc(x.description||'')}</textarea></div><div class="span2"><label>Poster URL (optional)</label><input name="posterUrl" value="${esc(x.poster||'')}"></div><div><label>Or poster file</label><input name="posterFile" type="file" accept="image/*"></div><div class="span2"><label>Trailer URL</label><input name="trailer" value="${esc(x.trailer||'')}"></div><div><label>Media file (optional)</label><input name="mediaFile" type="file"></div><div class="span2"><label>External download URL (optional)</label><input name="downloadUrl"></div><div><label>Download label</label><input name="downloadLabel" value="Primary server"></div></div><div style="height:12px"></div><button class="btn">${x.id?'Save changes':'Publish title'}</button> ${x.id?'<button class="btn secondary" type="button" id="cancelEdit">Cancel edit</button>':''}</form>`}
async function contentTab(editId=null){content=await api('/api/admin/content');const edit=editId?content.find(x=>x.id==editId):null;$('#view').innerHTML=`<div class="panel"><h2>${edit?'Edit title':'Add title'}</h2>${contentForm(edit||{})}</div><div class="panel scroll"><h2>Catalogue</h2><table><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>${content.map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="muted">${esc(x.year||'')} · ${esc(x.category)}</span></td><td>${esc(x.type)}</td><td><span class="pill">${esc(x.status)}</span></td><td><div class="actions"><button class="btn secondary" onclick="contentTab(${x.id})">Edit</button><button class="btn secondary" onclick="selectManage(${x.id})">Manage</button><button class="btn danger" onclick="removeContent(${x.id})">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`;$('#contentForm').onsubmit=saveContent;if($('#cancelEdit'))$('#cancelEdit').onclick=()=>contentTab()}
async function saveContent(e){e.preventDefault();const f=new FormData(e.target),id=f.get('id');f.delete('id');try{await api(id?'/api/admin/content/'+id:'/api/admin/content',{method:id?'PUT':'POST',body:f});toast(id?'Saved':'Published');contentTab()}catch(err){alert(err.message)}}async function removeContent(id){if(!confirm('Delete this title and its episodes/download links?'))return;await api('/api/admin/content/'+id,{method:'DELETE'});contentTab()}
async function selectManage(id){selected=Number(id);openTab('manage')}
async function manageTab(){content=await api('/api/admin/content');if(!selected&&content[0])selected=content[0].id;const options=content.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.title)}</option>`).join('');if(!selected)return $('#view').innerHTML='<div class="panel">Add a title first.</div>';const [eps,downs]=await Promise.all([api('/api/admin/content/'+selected+'/episodes'),api('/api/admin/content/'+selected+'/downloads')]);$('#view').innerHTML=`<div class="panel"><label>Choose title</label><select id="pick">${options}</select></div><div class="panel"><h2>Add episode</h2><form id="epForm" class="row"><div><label>Season</label><input name="season" type="number" value="1"></div><div><label>Episode</label><input name="episode" type="number" value="1"></div><div><label>Title</label><input name="title"></div><div><button class="btn">Add</button></div></form><div class="scroll"><table><tbody>${eps.map(e=>`<tr><td>S${e.season}E${e.episode} ${esc(e.title||'')}</td><td><button class="btn danger" onclick="deleteEpisode(${e.id})">Delete</button></td></tr>`).join('')||'<tr><td class="muted">No episodes yet.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Add download server</h2><form id="dlForm"><div class="formgrid"><div><label>Label</label><input name="label" value="Download server"></div><div><label>URL</label><input name="url" placeholder="https://..."></div><div><label>Episode (optional)</label><select name="episodeId"><option value="">Whole title</option>${eps.map(e=>`<option value="${e.id}">S${e.season}E${e.episode}</option>`).join('')}</select></div><div><label>Quality</label><input name="quality"></div><div><label>Size</label><input name="size"></div><div><label>Or upload file</label><input name="file" type="file"></div></div><div style="height:10px"></div><button class="btn">Add server</button></form><div class="scroll"><table><tbody>${downs.map(d=>`<tr><td><b>${esc(d.label)}</b><br><span class="muted">${d.episode_id?'Episode '+d.episode_id:'Whole title'} · ${esc(d.quality||'')} · ${esc(d.size||'')}</span></td><td>${d.click_count||0} clicks</td><td><button class="btn danger" onclick="deleteDownload(${d.id})">Delete</button></td></tr>`).join('')||'<tr><td class="muted">No download servers yet.</td></tr>'}</tbody></table></div></div>`;$('#pick').onchange=e=>{selected=Number(e.target.value);manageTab()};$('#epForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/content/'+selected+'/episodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});manageTab()};$('#dlForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/content/'+selected+'/downloads',{method:'POST',body:new FormData(e.target)});manageTab()}}
async function deleteEpisode(id){if(confirm('Delete episode?')){await api('/api/admin/episodes/'+id,{method:'DELETE'});manageTab()}}async function deleteDownload(id){if(confirm('Delete download server?')){await api('/api/admin/downloads/'+id,{method:'DELETE'});manageTab()}}
async function commentsTab(){const rows=await api('/api/admin/comments');$('#view').innerHTML=`<div class="panel scroll"><table><thead><tr><th>User / title</th><th>Comment</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.username)}</b><br>${esc(c.content_title)}</td><td>${esc(c.body)}</td><td>${esc(c.status)}</td><td><div class="actions"><button class="btn" onclick="commentStatus(${c.id},'approved')">Approve</button><button class="btn secondary" onclick="commentStatus(${c.id},'rejected')">Reject</button><button class="btn danger" onclick="deleteComment(${c.id})">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}async function commentStatus(id,status){await api('/api/admin/comments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});commentsTab()}async function deleteComment(id){await api('/api/admin/comments/'+id,{method:'DELETE'});commentsTab()}
async function adsTab(){const rows=await api('/api/admin/ads');$('#view').innerHTML=rows.map(a=>`<div class="panel"><form onsubmit="saveAd(event,'${a.key}')"><h2>${esc(a.name)}</h2><div class="formgrid"><div><label>Enabled</label><select name="enabled"><option value="true" ${a.enabled?'selected':''}>Yes</option><option value="false" ${!a.enabled?'selected':''}>No</option></select></div><div><label>Provider</label><select name="provider"><option ${a.provider==='placeholder'?'selected':''}>placeholder</option><option ${a.provider==='adsense'?'selected':''}>adsense</option></select></div><div><label>Label</label><input name="label" value="${esc(a.label)}"></div><div><label>Title</label><input name="title" value="${esc(a.title)}"></div><div><label>Link URL</label><input name="url" value="${esc(a.url)}"></div><div><label>AdSense client</label><input name="adsenseClient" value="${esc(a.adsenseClient)}"></div><div><label>AdSense slot</label><input name="adsenseSlot" value="${esc(a.adsenseSlot)}"></div><div class="span2"><label>Text</label><input name="text" value="${esc(a.text)}"></div></div><div style="height:10px"></div><button class="btn">Save ad</button></form></div>`).join('')}async function saveAd(e,key){e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.enabled=body.enabled==='true';await api('/api/admin/ads/'+key,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Ad saved')}
async function usersTab(){const rows=await api('/api/admin/users');$('#view').innerHTML=`<div class="panel scroll"><table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`}
async function settingsTab(){const s=await api('/api/admin/settings');$('#view').innerHTML=`<div class="panel"><form id="settings"><div class="formgrid"><div><label>Site name</label><input name="site_name" value="${esc(s.site_name||'CYWRLD')}"></div><div class="span2"><label>Tagline</label><input name="tagline" value="${esc(s.tagline||'')}"></div><div><label>Registration</label><select name="registration_enabled"><option value="true" ${s.registration_enabled!=='false'?'selected':''}>Enabled</option><option value="false" ${s.registration_enabled==='false'?'selected':''}>Disabled</option></select></div></div><div style="height:10px"></div><button class="btn">Save settings</button></form></div>`;$('#settings').onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Settings saved')}}
async function analyticsTab(){const a=await api('/api/admin/analytics?days=14');$('#view').innerHTML=`<div class="panel"><h2>Views · last 14 days</h2>${a.daily.map(x=>`<p>${esc(x.date)} — <b>${x.views}</b></p>`).join('')||'<p class="muted">No views yet.</p>'}</div><div class="panel scroll"><h2>Top titles</h2><table>${a.top.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.views} views</td></tr>`).join('')}</table></div><div class="panel scroll"><h2>Download clicks</h2><table>${a.downloads.map(x=>`<tr><td>${esc(x.title)} — ${esc(x.label)}</td><td>${x.clicks}</td></tr>`).join('')}</table></div>`}
boot().catch(e=>{$('#root').innerHTML=`<div class="login"><div class="panel">${esc(e.message)}</div></div>`});
</script></body></html>
