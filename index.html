<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYWRLD</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--soft:#1a202b;--text:#f7f8fb;--muted:#9ba5b5;--line:#262d39;--brand:#5ee1a2;--brand2:#62a8ff;--danger:#ff6b72}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080a0e,#0d1118);color:var(--text);font:15px/1.55 Inter,system-ui,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#090b10e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{height:66px;display:flex;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:.12em;font-size:21px}.logo b{color:var(--brand)}nav{display:flex;gap:15px;margin-left:auto;align-items:center}nav a{color:var(--muted)}nav a:hover{color:white}.hero{padding:64px 0 34px}.hero h1{font-size:clamp(36px,7vw,72px);line-height:.98;margin:0 0 18px;max-width:800px}.hero h1 span{color:var(--brand)}.hero p{max-width:650px;color:var(--muted);font-size:17px}.search{display:flex;gap:9px;max-width:700px;margin-top:25px}.search input,.field{width:100%;border:1px solid var(--line);background:#0d1118;color:white;border-radius:12px;padding:12px 14px}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--brand);color:#05120c;font-weight:800;cursor:pointer}.btn.secondary{background:var(--soft);color:white}.btn.danger{background:var(--danger);color:white}.ad{border:1px dashed #3a4557;border-radius:14px;min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:16px;margin:22px 0;background:#0c1016}.section{padding:22px 0}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:15px}.section h2{font-size:25px;margin:0}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}.chip.active{background:var(--brand);color:#06130d;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#3a4658}.poster{aspect-ratio:2/3;width:100%;object-fit:cover;background:linear-gradient(145deg,#1e2938,#11151d 45%,#163b2c);display:block}.poster.fallback{display:grid;place-items:center;color:#cbd3dd;font-weight:900;letter-spacing:.08em;text-align:center;padding:20px}.cardbody{padding:12px}.card h3{font-size:15px;margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.detail{display:grid;grid-template-columns:270px 1fr;gap:28px;padding:38px 0}.detail .poster{border-radius:18px;border:1px solid var(--line)}.detail h1{font-size:clamp(32px,6vw,58px);line-height:1;margin:0 0 13px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.tag{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#cbd2dc}.downloads,.comments,.accountbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.download{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 0}.download:first-of-type{border-top:0}.episode{border-top:1px solid var(--line);padding:14px 0}.muted{color:var(--muted)}.forms{display:grid;grid-template-columns:1fr 1fr;gap:15px}.forms form{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px}.forms label{display:block;margin:10px 0 5px;color:var(--muted)}.forms input,.forms textarea{width:100%;border:1px solid var(--line);background:#0b0e14;color:white;padding:11px;border-radius:10px}.empty{padding:40px 10px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:50px;padding:30px 0;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:200px 1fr}}@media(max-width:620px){nav a:not(.keep){display:none}.hero{padding-top:38px}.grid{grid-template-columns:repeat(2,1fr)}.detail{display:block}.detail>.poster{width:180px;margin-bottom:22px}.forms{grid-template-columns:1fr}.search{flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><a class="logo" href="/">CY<b>WRLD</b></a><nav><a href="/">Discover</a><a href="/account">Account</a><a class="keep" href="/admin">Admin</a></nav></div></header>
<main id="app"><div class="wrap empty">Loading CYWRLD…</div></main>
<footer><div class="wrap">CYWRLD starter · Publish only content you have permission to distribute.</div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(url,opt={})=>{const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
let site={},ads={},me=null;
function poster(x){return x.poster?`<img class="poster" src="${esc(x.poster)}" alt="${esc(x.title)}">`:`<div class="poster fallback">${esc(x.title)}</div>`}
function ad(key){const a=ads[key];if(!a||!a.enabled)return'';if(a.provider==='adsense'&&a.adsenseClient&&a.adsenseSlot){setTimeout(()=>{try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch{}},30);return `<div class="ad"><ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="${esc(a.adsenseClient)}" data-ad-slot="${esc(a.adsenseSlot)}" data-ad-format="auto" data-full-width-responsive="true"></ins></div>`}return `<a class="ad" href="${esc(a.url||'#')}" rel="sponsored noopener"><div><small>${esc(a.label||'Advertisement')}</small><br><b>${esc(a.title||a.name||'Sponsored')}</b><br>${esc(a.text||'')}</div></a>`}
function card(x){return `<a class="card" href="/watch/${encodeURIComponent(x.slug)}">${poster(x)}<div class="cardbody"><h3>${esc(x.title)}</h3><div class="meta">${esc(x.year||'')} · ${esc(x.type||'')}</div></div></a>`}
async function init(){[site,ads,me]=await Promise.all([api('/api/site'),api('/api/ads'),api('/api/auth/me')]);document.title=(site.site_name||'CYWRLD');const p=location.pathname;if(p.startsWith('/watch/'))return detail(decodeURIComponent(p.split('/').pop()));if(p==='/account')return account();return home()}
async function home(q='',cat=''){const qs=new URLSearchParams();if(q)qs.set('q',q);if(cat)qs.set('category',cat);const [items,cats]=await Promise.all([api('/api/content?'+qs),api('/api/categories')]);$('#app').innerHTML=`<div class="wrap"><section class="hero"><h1>Your next find lives in <span>${esc(site.site_name||'CYWRLD')}</span>.</h1><p>${esc(site.tagline||'Browse a clean catalogue with clear details and verified download options.')}</p><form class="search" id="search"><input id="q" value="${esc(q)}" placeholder="Search titles, genres or categories"><button class="btn">Search</button></form></section>${ad('top')}<section class="section"><div class="sectionhead"><h2>${q?'Search results':'Latest releases'}</h2><span class="muted">${items.length} titles</span></div><div class="filters"><button class="chip ${!cat?'active':''}" data-cat="">All</button>${cats.map(c=>`<button class="chip ${cat===c.category?'active':''}" data-cat="${esc(c.category)}">${esc(c.category)} (${c.count})</button>`).join('')}</div><div style="height:16px"></div><div class="grid">${items.map(card).join('')||'<div class="empty">Nothing found.</div>'}</div></section>${ad('inline')}</div>`;$('#search').onsubmit=e=>{e.preventDefault();home($('#q').value.trim(),cat)};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>home(q,b.dataset.cat))}
async function detail(slug){try{const x=await api('/api/content/'+encodeURIComponent(slug));$('#app').innerHTML=`<div class="wrap"><section class="detail"><div>${poster(x)}</div><div><a class="muted" href="/">← Back to catalogue</a><h1>${esc(x.title)}</h1><div class="tags"><span class="tag">${esc(x.year||'')}</span><span class="tag">${esc(x.type)}</span><span class="tag">${esc(x.category)}</span>${x.quality?`<span class="tag">${esc(x.quality)}</span>`:''}</div><p class="muted">${esc(x.description)}</p><p><b>Genre:</b> ${esc(x.genre||'—')} · <b>Language:</b> ${esc(x.language||'—')} · <b>Country:</b> ${esc(x.country||'—')}</p>${x.trailer?`<p><a class="btn secondary" href="${esc(x.trailer)}" target="_blank" rel="noopener">Open trailer</a></p>`:''}${ad('sidebar')}</div></section>${ad('download')}<section class="downloads"><h2>Download options</h2>${x.downloads.map(d=>`<div class="download"><div><b>${esc(d.label)}</b><div class="meta">${esc(d.quality||'')} ${esc(d.size||'')}</div></div><a class="btn" href="/go/${d.id}">Download</a></div>`).join('')||'<p class="muted">No direct downloads for this title.</p>'}${x.episodes.length?`<h2>Episodes</h2>${x.episodes.map(e=>`<div class="episode"><b>S${e.season} · E${e.episode} ${esc(e.title||'')}</b>${e.downloads.map(d=>`<div class="download"><span>${esc(d.label)}</span><a class="btn secondary" href="/go/${d.id}">Download</a></div>`).join('')}</div>`).join('')}`:''}</section><section class="comments"><h2>Comments</h2>${x.comments.map(c=>`<p><b>${esc(c.username)}</b> <span class="meta">${new Date(c.createdAt).toLocaleDateString()}</span><br>${esc(c.body)}</p>`).join('')||'<p class="muted">No approved comments yet.</p>'}${me.user?`<form id="comment"><textarea class="field" name="body" rows="3" placeholder="Write a comment…" required></textarea><div style="height:8px"></div><button class="btn">Post comment</button></form>`:`<p><a href="/account">Sign in</a> to comment.</p>`}</section></div>`;if($('#comment'))$('#comment').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/content/'+x.id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:e.target.body.value})});alert(r.status==='approved'?'Comment posted.':'Comment submitted for approval.');e.target.reset()}catch(err){alert(err.message)}}}catch(e){$('#app').innerHTML=`<div class="wrap empty"><h2>Title not found</h2><a href="/">Return home</a></div>`}}
async function account(){me=await api('/api/auth/me');if(me.user){$('#app').innerHTML=`<div class="wrap section"><div class="accountbox"><h1>Hi, ${esc(me.user.username)}</h1><p class="muted">${esc(me.user.email)} · ${esc(me.user.role)}</p><button class="btn danger" id="logout">Sign out</button></div></div>`;$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};return}$('#app').innerHTML=`<div class="wrap section"><h1>Account</h1><div class="forms"><form id="login"><h2>Sign in</h2><label>Username or email</label><input name="identity" required><label>Password</label><input name="password" type="password" required><div style="height:12px"></div><button class="btn">Sign in</button></form><form id="register"><h2>Create account</h2><label>Username</label><input name="username" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><div style="height:12px"></div><button class="btn">Register</button></form></div></div>`;$('#login').onsubmit=e=>authForm(e,'/api/auth/login');$('#register').onsubmit=e=>authForm(e,'/api/auth/register')}
async function authForm(e,url){e.preventDefault();const body=Object.fromEntries(new FormData(e.target));try{await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});location.href='/account'}catch(err){alert(err.message)}}
init().catch(e=>{$('#app').innerHTML=`<div class="wrap empty">${esc(e.message)}</div>`});
</script>
</body></html>
